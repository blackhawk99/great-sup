<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { color: #1d4ed8; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #eff6ff; color: #111827; display: flex; flex-direction: column; position: relative">

  <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px; height: 52px; background: #ffffff; border-bottom: 1px solid #dbeafe; flex-shrink: 0">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
      <div style="font-size: 15px; font-weight: 600; line-height: 18px; color: #111827">Paddleboard</div>
      <div style="font-size: 11px; line-height: 13px; color: #6b7280">Monday 18 August · 7 spots</div>
    </div>
    <div style="display: flex; align-items: center; gap: 2px">
      <div style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      </div>
      <div style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 0 16px">

    <div style="display: flex; gap: 4px; padding: 3px; background: #dbeafe; border-radius: 10px; flex-shrink: 0">
      <div onClick="{{ pickToday }}" style="{{ tabToday }}">Today</div>
      <div onClick="{{ pickTomorrow }}" style="{{ tabTomorrow }}">Tomorrow</div>
    </div>

    <div style="background: #2563eb; border-radius: 16px; padding: 16px 16px 14px 16px; flex-shrink: 0; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.28)">
      <div style="display: flex; align-items: flex-start; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
          <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #bfdbfe">{{ hero.eyebrow }}</div>
          <div style="font-size: 21px; font-weight: 700; line-height: 25px; color: #ffffff">{{ hero.name }}</div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px">
            <span style="{{ hero.pillStyle }}">{{ hero.label }}</span>
            <span style="font-size: 11px; color: #bfdbfe">{{ hero.region }}</span>
          </div>
        </div>
        <svg width="72" height="72" viewBox="0 0 72 72" style="flex-shrink: 0">
          <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(255,255,255,0.22)" strokeWidth="6"></circle>
          <circle cx="36" cy="36" r="30" fill="none" stroke="#ffffff" strokeWidth="6" strokeLinecap="round" strokeDasharray="{{ hero.dash }}" transform="rotate(-90 36 36)"></circle>
          <text x="36" y="39" textAnchor="middle" fill="#ffffff" fontSize="23" fontWeight="700" fontFamily="ui-sans-serif, system-ui, sans-serif">{{ hero.score }}</text>
          <text x="36" y="51" textAnchor="middle" fill="#bfdbfe" fontSize="9" fontWeight="600" fontFamily="ui-sans-serif, system-ui, sans-serif">SCORE</text>
        </svg>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.18); margin: 14px 0 12px 0"></div>

      <div style="display: flex; align-items: center; gap: 7px; margin-bottom: 10px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style="flex-shrink: 0"><path d="M12 2v8"></path><path d="m4.93 10.93 1.41 1.41"></path><path d="M2 18h2"></path><path d="M20 18h2"></path><path d="m19.07 10.93-1.41 1.41"></path><path d="M22 22H2"></path><path d="m8 6 4-4 4 4"></path><path d="M16 18a4 4 0 0 0-8 0"></path></svg>
        <span style="font-size: 13px; font-weight: 600; color: #ffffff; flex-grow: 1">{{ hero.windowText }}</span>
        <span style="font-size: 11px; color: #bfdbfe">{{ hero.peakText }}</span>
      </div>

      <div style="display: flex; align-items: flex-end; gap: 3px; height: 34px">
        <sc-for list="{{ hero.bars }}" as="bar" hint-placeholder-count="15">
          <div style="{{ bar.style }}"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 9px; font-weight: 600; color: #bfdbfe; letter-spacing: 0.04em">
        <span>06:00</span><span>13:00</span><span>20:00</span>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; height: 40px; background: #ffffff; border-radius: 10px">
        <span style="font-size: 14px; font-weight: 600; color: #1d4ed8">Open forecast</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px; flex-shrink: 0">
      <span style="font-size: 13px; font-weight: 700; color: #1f2937">All spots</span>
      <span style="font-size: 11px; color: #6b7280; flex-grow: 1">ranked by {{ dayWord }}'s score</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; overflow: hidden">
      <sc-for list="{{ rows }}" as="row" hint-placeholder-count="5">
        <div onClick="{{ row.pick }}" style="{{ row.cardStyle }}">
          <span style="font-size: 12px; font-weight: 600; color: #9ca3af; width: 14px; flex-shrink: 0; font-variant-numeric: tabular-nums">{{ row.rank }}</span>
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 5px">
              <sc-if value="{{ row.home }}" hint-placeholder-val="{{ true }}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f97316" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style="flex-shrink: 0"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              </sc-if>
              <span style="font-size: 15px; font-weight: 600; color: #111827">{{ row.name }}</span>
            </div>
            <span style="font-size: 11px; color: #6b7280; font-variant-numeric: tabular-nums">{{ row.meta }}</span>
          </div>
          <svg width="40" height="40" viewBox="0 0 40 40" style="flex-shrink: 0">
            <circle cx="20" cy="20" r="16.5" fill="none" stroke="#e5e7eb" strokeWidth="3.5"></circle>
            <circle cx="20" cy="20" r="16.5" fill="none" stroke="{{ row.color }}" strokeWidth="3.5" strokeLinecap="round" strokeDasharray="{{ row.dash }}" transform="rotate(-90 20 20)"></circle>
            <text x="20" y="24" textAnchor="middle" fill="{{ row.color }}" fontSize="14" fontWeight="700" fontFamily="ui-sans-serif, system-ui, sans-serif">{{ row.score }}</text>
          </svg>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #ffffff; border-top: 1px solid #dbeafe; display: flex; align-items: center; gap: 10px; padding: 0 16px">
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; flex-grow: 1; background: #2563eb; border-radius: 10px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
      <span style="font-size: 14px; font-weight: 600; color: #ffffff">Add spot</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 14px; border: 1px solid #bfdbfe; border-radius: 10px; background: #ffffff">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"></path></svg>
      <span style="font-size: 14px; font-weight: 600; color: #1d4ed8">Nearby</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 0, picked: null };
  }

  spots() {
    return [
      { id: 'vlikhos', name: 'Vlikhos Bay',  region: 'Hydra, Saronic',   home: false,
        d: [ { peak: 93, at: 8, build: 3.2, dawn: 4.0, wind: 6,  raw: 14, wave: 0.10 },
             { peak: 85, at: 9, build: 2.6, dawn: 3.4, wind: 9,  raw: 17, wave: 0.15 } ] },
      { id: 'kavouri', name: 'Kavouri Beach', region: 'Athens Riviera',  home: true,
        d: [ { peak: 88, at: 7, build: 3.6, dawn: 5.0, wind: 11, raw: 19, wave: 0.25 },
             { peak: 80, at: 7, build: 3.1, dawn: 4.4, wind: 13, raw: 21, wave: 0.30 } ] },
      { id: 'kapsali', name: 'Kapsali Beach', region: 'Kythira',         home: false,
        d: [ { peak: 78, at: 7, build: 3.0, dawn: 4.5, wind: 14, raw: 24, wave: 0.35 },
             { peak: 89, at: 8, build: 2.8, dawn: 3.8, wind: 8,  raw: 16, wave: 0.15 } ] },
      { id: 'astir',   name: 'Astir Beach',   region: 'Vouliagmeni',     home: false,
        d: [ { peak: 71, at: 8, build: 3.4, dawn: 4.2, wind: 16, raw: 22, wave: 0.30 },
             { peak: 74, at: 8, build: 3.0, dawn: 4.0, wind: 15, raw: 23, wave: 0.30 } ] },
      { id: 'glyfada', name: 'Glyfada Beach', region: 'Athens Riviera',  home: false,
        d: [ { peak: 63, at: 7, build: 3.0, dawn: 4.0, wind: 19, raw: 26, wave: 0.45 },
             { peak: 66, at: 8, build: 2.9, dawn: 3.8, wind: 18, raw: 25, wave: 0.40 } ] },
      { id: 'vathy',   name: 'Vathy Bay',     region: 'Sifnos, Cyclades',home: false,
        d: [ { peak: 48, at: 6, build: 2.6, dawn: 3.0, wind: 26, raw: 41, wave: 0.60 },
             { peak: 70, at: 7, build: 2.8, dawn: 3.6, wind: 17, raw: 29, wave: 0.40 } ] },
      { id: 'naoussa', name: 'Naoussa Bay',   region: 'Paros, Cyclades', home: false,
        d: [ { peak: 34, at: 6, build: 2.2, dawn: 2.5, wind: 33, raw: 52, wave: 0.90 },
             { peak: 52, at: 7, build: 2.4, dawn: 3.0, wind: 24, raw: 38, wave: 0.55 } ] }
    ];
  }

  curve(p) {
    const out = [];
    for (let h = 6; h <= 20; h += 1) {
      let s = p.peak;
      if (h > p.at) s -= p.build * Math.pow(h - p.at, 1.15);
      if (h < p.at) s -= p.dawn * Math.pow(p.at - h, 1.2);
      if (h >= 17) s += 2.2 * (h - 16);
      out.push(Math.max(18, Math.min(99, Math.round(s))));
    }
    return out;
  }

  tier(score) {
    if (score >= 85) return { color: '#16a34a', soft: '#4ade80', label: 'Perfect' };
    if (score >= 70) return { color: '#ca8a04', soft: '#facc15', label: 'Okay-ish' };
    if (score >= 50) return { color: '#ea580c', soft: '#fb923c', label: 'Not great' };
    return { color: '#dc2626', soft: '#f87171', label: 'Nope' };
  }

  window(hours) {
    let best = { start: -1, len: 0 };
    let run = 0;
    for (let i = 0; i < hours.length; i += 1) {
      if (hours[i] >= 75) {
        run += 1;
        if (run > best.len) best = { start: i - run + 1, len: run };
      } else {
        run = 0;
      }
    }
    if (best.len < 2) return null;
    const pad = (n) => String(n).padStart(2, '0');
    return pad(6 + best.start) + ':00 – ' + pad(6 + best.start + best.len - 1) + ':00';
  }

  build() {
    const day = this.state.day;
    return this.spots().map((s) => {
      const p = s.d[day];
      const hours = this.curve(p);
      const score = Math.max.apply(null, hours);
      const at = 6 + hours.indexOf(score);
      const t = this.tier(score);
      return { id: s.id, name: s.name, region: s.region, home: s.home,
        hours, score, tier: t, wind: p.wind, raw: p.raw, wave: p.wave,
        peak: String(at).padStart(2, '0') + ':00', win: this.window(hours) };
    }).sort((a, b) => b.score - a.score);
  }

  renderVals() {
    const day = this.state.day;
    const list = this.build();
    const picked = list.find((s) => s.id === this.state.picked) || list[0];
    const C = 2 * Math.PI * 30;
    const c40 = 2 * Math.PI * 16.5;

    const tab = (on) => 'flex-grow: 1; height: 34px; display: flex; align-items: center; justify-content: center;'
      + ' font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer;'
      + (on ? ' background: #ffffff; color: #1d4ed8; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.06);'
            : ' background: transparent; color: #1d4ed8; opacity: 0.65;');

    return {
      dayWord: day === 0 ? 'today' : 'tomorrow',
      pickToday: () => this.setState({ day: 0, picked: null }),
      pickTomorrow: () => this.setState({ day: 1, picked: null }),
      tabToday: tab(day === 0),
      tabTomorrow: tab(day === 1),
      hero: {
        eyebrow: picked.id === list[0].id ? (day === 0 ? 'BEST RIGHT NOW' : 'BEST TOMORROW') : 'SELECTED SPOT',
        name: picked.name,
        region: picked.region,
        label: picked.tier.label,
        score: picked.score,
        dash: (C * picked.score / 100).toFixed(1) + ' ' + C.toFixed(1),
        pillStyle: 'font-size: 11px; font-weight: 700; color: #ffffff; background: rgba(255,255,255,0.2);'
          + ' border-radius: 999px; padding: 2px 8px;',
        windowText: picked.win ? 'Best window ' + picked.win : 'No calm window all day',
        peakText: picked.win ? 'peak ' + picked.peak : 'wind ' + picked.wind + ' km/h',
        bars: picked.hours.map((h, i) => ({
          style: 'flex-grow: 1; border-radius: 2px; height: ' + Math.max(5, Math.round(h * 0.34)) + 'px;'
            + ' background: ' + this.tier(h).soft + '; opacity: ' + (h >= 75 ? '1' : '0.6') + ';',
          key: i
        }))
      },
      rows: list.slice(0, 5).map((s, i) => ({
        rank: i + 1,
        name: s.name,
        home: s.home,
        score: s.score,
        color: s.tier.color,
        dash: (c40 * s.score / 100).toFixed(1) + ' ' + c40.toFixed(1),
        meta: s.win
          ? s.wind + ' km/h · ' + s.wave.toFixed(2) + ' m · ' + s.win
          : s.wind + ' km/h · ' + s.wave.toFixed(2) + ' m · no window',
        pick: () => this.setState({ picked: s.id }),
        cardStyle: 'display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px;'
          + ' background: ' + (s.id === picked.id ? '#eff6ff' : '#ffffff') + '; cursor: pointer;'
          + ' box-shadow: inset 0 0 0 ' + (s.id === picked.id ? '2px #2563eb' : '1px #dbeafe') + ';'
      }))
    };
  }
}
</script>
</body>
</html>
