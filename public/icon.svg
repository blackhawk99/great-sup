<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="paddleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Wave shapes -->
  <path d="M40 300c40-40 80 0 120-40s80 0 120-40 80 0 120-40 80 0 80-10"
        stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>
  <path d="M40 360c40-40 80 0 120-40s80 0 120-40 80 0 120-40 80 0 80-10"
        stroke="url(#waveGrad)" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M40 420c40-40 80 0 120-40s80 0 120-40 80 0 120-40 80 0 80-10"
        stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- SUP Paddle -->
  <ellipse cx="256" cy="110" rx="45" ry="65" fill="url(#paddleGrad)"/>
  <rect x="242" y="165" width="28" height="200" rx="10" fill="url(#paddleGrad)"/>

  <!-- Sparkle accents -->
  <circle cx="420" cy="90" r="18" fill="#fbbf24"/>
  <circle cx="90" cy="150" r="12" fill="#fbbf24" opacity="0.7"/>
</svg>
